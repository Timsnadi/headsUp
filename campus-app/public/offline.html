<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c62836" />
    <title>Offline</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f5;
        font-family: 'Segoe UI', sans-serif;
        color: #222326;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        background: rgba(255,255,255,0.88);
        border: 1px solid rgba(148,163,184,0.25);
        border-radius: 1.25rem;
        padding: 2rem;
        text-align: center;
        max-width: 320px;
      }
      h1 { margin: 0 0 0.75rem; }
      p { margin: 0;       color: #55565b; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Your classes and notes are still available on this device. Connect to the internet to refresh the latest data.</p>
    </main>
  </body>
</html>
